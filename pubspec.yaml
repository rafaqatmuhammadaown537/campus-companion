name: campus_companion
description: Campus Companion - JWT auth, offline storage, timetable, attendance and announcements.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  sqflite: ^2.4.0
  path: ^1.9.0
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
